services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment: &app-env
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: club_lectura
      DB_USERNAME: root
      DB_PASSWORD: secret
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy

  queue:
    build: .
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "false"
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: club_lectura
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
